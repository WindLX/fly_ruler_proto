[bridge]
listen = "127.0.0.1:18002"
# aircraft_id = "00112233445566778899aabbccddeeff"
tick_hz = 240.0
# SimConnect render/write cadence. Defaults to tick_hz when omitted.
render_hz = 240.0
# latest preserves old latest-sample writes for A/B tests.
# low_latency is the default: 30 ms interpolation delay + 40 ms short extrapolation.
# smooth uses 80 ms interpolation delay + 20 ms short extrapolation.
smoothing_mode = "low_latency"
interpolation_delay_ms = 20
max_extrapolation_ms = 20
stale_timeout_ms = 500
# Optional multi-aircraft rendering. The selected aircraft remains the MSFS
# user aircraft; additional spawned FlyRuler aircraft are created as non-ATC AI
# aircraft using this shared title.
enable_ai_aircraft = false
ai_aircraft_title = "Rafale M"
max_ai_aircraft = 8

[management]
enabled = true
listen = "0.0.0.0:18003"
# Paths are resolved relative to the directory from which the bridge is launched.
data_root = "sessions"
web_root = "web/dist"
# public_api_base_url = "https://sim.example.test/api/v1"
# public_websocket_url = "wss://sim.example.test/api/v1/ws"
ws_hz = 30.0
# The console is served by the bridge itself, so the browser reaches the API on
# the same origin and no extra origin is needed; the built-in allowlist already
# covers the usual local development ports. Set `cors_origins = ["..."]` only
# when the frontend is hosted elsewhere, and note that it replaces the built-in
# list instead of extending it.

[logging]
level = "info"
# file_path = "logs/fly-ruler-msfs.log"
