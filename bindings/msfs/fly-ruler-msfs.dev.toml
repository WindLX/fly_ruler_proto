# Development configuration: every relative path is resolved against the
# package directory, so sessions land in ./sessions and the console reads
# ./web/dist. `just msfs run` loads this file by default.
#
# The installed user configuration is generated by scripts/install-msfs.sh into
# ~/.config/fly-ruler-msfs/fly-ruler-msfs.toml and uses absolute paths only.
# To run with a different file: FR_MSFS_CONFIG=/path/to/other.toml just msfs run

[bridge]
listen = "127.0.0.1:18002"
# aircraft_id = "00112233445566778899aabbccddeeff"
tick_hz = 240.0
render_hz = 240.0
# latest preserves old latest-sample writes for A/B tests.
# low_latency is the default: 30 ms interpolation delay + 40 ms short extrapolation.
# smooth uses 80 ms interpolation delay + 20 ms short extrapolation.
smoothing_mode = "low_latency"
interpolation_delay_ms = 20
max_extrapolation_ms = 20
stale_timeout_ms = 500
# Optional multi-aircraft rendering. The selected aircraft remains the MSFS
# user aircraft; additional spawned FlyRuler aircraft are created as non-ATC AI
# aircraft using this shared title.
enable_ai_aircraft = false
ai_aircraft_title = "Rafale M"
max_ai_aircraft = 8

[management]
enabled = true
listen = "127.0.0.1:18003"
data_root = "sessions"
web_root = "web/dist"
ws_hz = 30.0
# The Vite dev server on 5173 is where the console is edited, so keep its origin
# here: when the frontend points straight at this management API the browser
# sends an Origin and the request needs to be allowed. `web/vite.config.ts`
# proxies /api to 18003 by default, in which case the browser stays on 5173 and
# nothing is cross-origin; the absolute case is what this list covers.
# Setting `cors_origins` replaces the built-in allowlist instead of extending it.
cors_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

[logging]
level = "info"
# file_path = "logs/fly-ruler-msfs.log"
