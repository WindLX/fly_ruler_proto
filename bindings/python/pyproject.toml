[project]
name = "fly_ruler_proto_python"
dynamic = ["version"]
description = "Python client and PyO3 bindings for the FlyRuler protobuf/UDP protocol"
readme = "README.md"
authors = [
    { name = "windlx", email = "1418043337@qq.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fly_ruler_proto_python = "fly_ruler_proto_python:main"

[tool.maturin]
module-name = "fly_ruler_proto_python._core"
python-packages = ["fly_ruler_proto_python"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.7",
    "mypy>=2.0.0",
    "pytest>=9.1.0",
    "ruff>=0.14.0",
    "patchelf>=0.17; sys_platform == 'linux'",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/fly_ruler_proto_python", "tests"]
