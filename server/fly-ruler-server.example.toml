schema_version = 2

[transport]
udp_listen = "127.0.0.1:18002"
heartbeat_interval_secs = 5
heartbeat_timeout_secs = 15

[cursor_stream]
publish_hz = 30.0
max_subscribers = 16
reconnect_initial_secs = 0.5
reconnect_max_secs = 5.0

[management]
enabled = true
listen = "127.0.0.1:18003"
# Paths are resolved relative to the directory from which the server is launched.
data_root = "sessions"
web_root = "web/dist"
# public_api_base_url = "https://sim.example.test/api/v1"
# public_websocket_url = "wss://sim.example.test/api/v1/ws"
websocket_hz = 30.0
# The console is served by the server itself, so the browser reaches the API on
# the same origin and no extra origin is needed; the built-in allowlist already
# covers the usual local development ports. Set `cors_origins = ["..."]` only
# when the frontend is hosted elsewhere, and note that it replaces the built-in
# list instead of extending it.

[playback]
default_speed = 1.0
min_speed = 0.1
max_speed = 16.0

[logging]
level = "info"
# file_path = "logs/fly-ruler-server.log"
